{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DevJobs Pro</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        /* =======================
           GLOBAL BODY
        ======================= */
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #e5e7eb;
            min-height: 100vh;
        }

        /* =======================
           TEXT FIX
        ======================= */
        h1, h2, h3, h4, h5, h6, p, span, label {
            color: #e5e7eb !important;
        }

        a {
            color: #60a5fa;
        }

        /* =======================
           NAVBAR
        ======================= */
        .navbar {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .navbar-brand {
            font-weight: bold;
            color: #ffffff !important;
        }

        .nav-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* =======================
           PAGE WRAPPER
        ======================= */
        .page-container {
            padding-top: 40px;
            padding-bottom: 40px;
        }

        /* =======================
           CARDS
        ======================= */
        .card {
            background: rgba(17, 24, 39, 0.95);
            color: #e5e7eb;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
        }

        /* =======================
           INPUT FIX (IMPORTANT)
        ======================= */
        input, select, textarea {
            background-color: #0b1220 !important;
            color: #e5e7eb !important;
            border: 1px solid rgba(255,255,255,0.15) !important;
        }

        input::placeholder {
            color: #9ca3af !important;
        }

        input:focus, textarea:focus, select:focus {
            background-color: #0b1220 !important;
            color: #ffffff !important;
            border-color: #6366f1 !important;
            box-shadow: none !important;
        }

        /* =======================
           BUTTONS
        ======================= */
        .btn {
            border-radius: 8px;
        }

        .btn-primary { background: #6366f1; border: none; }
        .btn-success { background: #22c55e; border: none; }
        .btn-warning { background: #f59e0b; border: none; }
    .card, .card * {
    color: #e5e7eb !important;
}

/* Make job title stand out */
.card h5 {
    color: #ffffff !important;
    font-weight: 600;
}

/* Strong labels */
.card strong {
    color: #cbd5e1 !important;
}
    </style>
</head>

<body>

<!-- =======================
     NAVBAR
======================= -->
{% if request.path != '/login/' and request.path != '/register/' %}
<nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container d-flex justify-content-between align-items-center">

        <!-- LEFT -->
        <div class="nav-section">
            <a class="navbar-brand" href="{% url 'job_list' %}">
                DevJobs Pro
            </a>
        </div>

        <!-- CENTER -->
        <div class="nav-section">
            <a href="{% url 'job_list' %}" class="btn btn-outline-light btn-sm">
                Jobs
            </a>

            <a href="{% url 'premium' %}" class="btn btn-warning btn-sm">
                Premium
            </a>
        </div>

        <!-- RIGHT -->
        <div class="nav-section">

            {% if user.is_authenticated %}

                <a href="{% url 'dashboard' %}" class="btn btn-outline-light btn-sm">
                    Dashboard
                </a>

                <a href="{% url 'logout' %}" class="btn btn-danger btn-sm">
                    Logout
                </a>

            {% else %}

                <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">
                    Login
                </a>

                <a href="{% url 'register' %}" class="btn btn-success btn-sm">
                    Register
                </a>

            {% endif %}

        </div>

    </div>
</nav>
{% endif %}

<!-- =======================
     CONTENT
======================= -->
<div class="container page-container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>

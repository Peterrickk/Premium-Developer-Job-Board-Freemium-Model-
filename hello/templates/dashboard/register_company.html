{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 shadow-sm">
            <h3 class="mb-3 text-center">Register Your Company</h3>
            <p class="text-muted text-center small">Set up your business profile to start managing job listings.</p>
            <hr>
            <form method="POST">
                {% csrf_token %}
                
                {{ form.as_p }}
                
                <div class="d-flex gap-2 mt-4">
                    <a href="{% url 'dashboard' %}" class="btn btn-secondary w-50">Cancel</a>
                    <button type="submit" class="btn btn-success w-50">Save Profile</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

services:
  - type: web
    name: premium-job-board
    env: python
    plan: free
    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      python manage.py create_admin
    startCommand: gunicorn mysite.wsgi:application --bind 0.0.0.0:10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DEBUG
        value: "False"
      - fromGroup: django
    healthCheckPath: /

  - type: pserv
    name: redis
    env: docker
    plan: free
    dockerCommand: redis-server --appendonly yes

envVarGroups:
  - name: django
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        value: # Set in Render dashboard
      - key: CLOUDINARY_API_KEY
        value: # Set in Render dashboard
      - key: CLOUDINARY_API_SECRET
        value: # Set in Render dashboard

databases:
  - name: postgres
    ipAllowList: []
